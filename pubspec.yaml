name: dart_jieba
description: DaJieBa - Pure Dart Chinese text segmentation, a port of Python jieba with binary trie and delta-gzip compression.
version: 1.0.1
repository: https://github.com/marsup-space/dart-jieba
license: MIT

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Make the built-in dictionary available to Flutter applications that depend on
# this package (including dependencies resolved from a Git repository).
flutter:
  assets:
    - assets/dict.dgz
